[project]
name = "slowlane"
version = "0.3.0"
description = "Command-line automation for App Store Connect and the Apple Developer Portal"
authors = [{name = "Slowlane Contributors"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
keywords = ["app-store-connect", "apple", "automation", "cli", "testflight"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.3.3,<9.0.0",
    "cryptography>=48.0.1,<49.0.0",
    "httpx>=0.28.1,<0.29.0",
    "idna>=3.15,<4.0",
    "keyring>=25.7.0,<26.0.0",
    "pygments>=2.20.0,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "rich>=14.3.1,<15.0.0",
    "tomli-w>=1.2.0,<2.0.0",
    "typer>=0.21.1,<0.25.0",
]

[project.optional-dependencies]
interactive = ["playwright>=1.58.0,<2.0.0"]

[project.urls]
Homepage = "https://github.com/Demoen/slowlane"
Documentation = "https://demoen.github.io/slowlane/"
Repository = "https://github.com/Demoen/slowlane"
Changelog = "https://github.com/Demoen/slowlane/blob/main/CHANGELOG.md"
Issues = "https://github.com/Demoen/slowlane/issues"

[project.scripts]
slowlane = "slowlane.cli.main:run"

[tool.poetry]
packages = [{include = "slowlane", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
vcrpy = "^8.2.1"
mypy = "^1.19.1"
ruff = ">=0.16.1,<0.17.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"

[tool.poetry.group.release]
optional = true

[tool.poetry.group.release.dependencies]
twine = "^7.0.0"

[tool.poetry.group.security]
optional = true

[tool.poetry.group.security.dependencies]
bandit = "^1.9.4"
pip-audit = "^2.10.1"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["keyring.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/slowlane --cov-report=term-missing --cov-report=html --cov-fail-under=65"

[tool.coverage.run]
source = ["src/slowlane"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
