version: 2
updates:
  - package-ecosystem: pip
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      python-monthly:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-monthly:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
