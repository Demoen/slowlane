site_name: Slowlane
site_description: Command-line automation for App Store Connect and the Apple Developer Portal
site_url: https://demoen.github.io/slowlane/
repo_url: https://github.com/Demoen/slowlane
repo_name: Demoen/slowlane
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/console
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Demoen/slowlane

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Authentication: authentication.md
  - App Store Connect:
      - Apps: usage/apps.md
      - Builds and TestFlight: usage/builds.md
      - Uploads: usage/upload.md
  - Developer Portal:
      - Certificates: usage/certificates.md
      - Provisioning Profiles: usage/profiles.md
  - Reference:
      - Configuration: configuration.md
      - CLI: cli.md
